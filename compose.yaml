services:
  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm ci && exec npm run dev -- --host 0.0.0.0 --strictPort"]
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - dashboard_node_modules:/app/node_modules

volumes:
  dashboard_node_modules:
